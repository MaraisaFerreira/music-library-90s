spring:
  application:
    name: music-library-90s
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    clean-disabled: false
    locations: classpath:db/test-migration


logging:
  level:
    root: warn
    maraisaferreira.com.github: info
    org.flywaydb: info