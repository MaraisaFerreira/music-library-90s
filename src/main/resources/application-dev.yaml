spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/music_library_dev_db?useTimezone=true&serverTimezone=UTC
    username: "${DB_DEV_USERNAME:${dev.username}}"
    password: "${DB_DEV_PASSWORD:${dev.password}}"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true


logging:
  level:
    root: warn
    maraisaferreira.com.github: info
    org.flywaydb: info