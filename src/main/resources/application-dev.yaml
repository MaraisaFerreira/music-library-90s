spring:
  application:
    name: music-library-90s
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/${DB_DEV_NAME:${dev.db-name}}
    username: "${DB_DEV_USERNAME:${dev.username}}"
    password: "${DB_DEV_PASSWORD:${dev.password}}"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: warn
    maraisaferreira.com.github: info
    org.flywaydb: info